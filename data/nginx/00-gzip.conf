# Diretivas de nivel http — o nginx.conf da imagem inclui conf.d/*.conf
# dentro do bloco http{}. Prefixo 00- para carregar antes dos server blocks.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
